version: 1
tools:
  - id: literature_search
    module: evidence
    owner_workstream: E
    enabled: false
    input_schema: schemas/task_spec.schema.json
    output_schema: schemas/tool_result.schema.json

  - id: public_omics_analysis
    module: omics
    owner_workstreams: [B, C]
    enabled: false
    output_schema: schemas/tool_result.schema.json

  - id: observed_perturbation
    module: perturbation
    owner_workstreams: [C, F]
    enabled: false
    output_schema: schemas/perturbation_result.schema.json

  - id: predicted_perturbation
    module: perturbation
    owner_workstreams: [B, F]
    enabled: false
    output_schema: schemas/perturbation_result.schema.json

  - id: variant_oracle
    module: genetics
    owner_workstream: C
    enabled: false
    output_schema: schemas/tool_result.schema.json

  - id: target_ranker
    module: target
    owner_workstreams: [C, F]
    enabled: false
    output_schema: schemas/target_card.schema.json

  - id: drug_matcher
    module: drug
    owner_workstream: D
    enabled: false
    output_schema: schemas/tool_result.schema.json
