contract_version: "2.0.0"
tools:
  - id: uc_omics_snapshot
    enabled: true
    validation_scope: GSE125527 ulcerative-colitis donor-pseudobulk snapshot
  - id: open_targets
    enabled: true
    validation_scope: Open Targets human disease-target associations and known drugs
  - id: europe_pmc_rag
    enabled: true
    validation_scope: Europe PMC source text with exact-span extraction
  - id: observed_tcell_perturbation
    enabled: true
    validation_scope: GSE190604 primary human T-cell CRISPRa, 71 targets
  - id: deltafactor
    enabled: true
    validation_scope: Norman K562 benchmark; UC context is exploratory and excluded from formal score
  - id: mch_causal_gold
    enabled: true
    validation_scope: exact MCH gold-sample configuration only
