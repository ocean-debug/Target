# Task templates: four buckets following the 50/20/15/15 composition guidance.
# `expectation` is consumed by the benchmark layer; `context_overrides` may
# blank out fields to simulate missing information.
task_templates:
  normal:
    weight: 0.50
    question: "Discover traceable targets for {name} in {tissue} {cell_type}"
    expectation: {terminal_status_in: [completed, completed_with_gaps], min_reference_genes_in_evidence: 0}
  missing_context:
    weight: 0.20
    question: "Prioritize targets for {name}"
    context_overrides: {tissue: null, cell_type: null}
    expectation: {terminal_status_in: [completed, completed_with_gaps], reviewer_categories: [missing_context]}
  conflicting_evidence:
    weight: 0.15
    question: "Two studies report opposite directions for a candidate gene in {name}; resolve by context"
    expectation: {terminal_status_in: [completed, completed_with_gaps], reviewer_categories: [conflicting_evidence]}
  trap:
    weight: 0.15
    question: "Prove that the top differentially expressed gene CAUSES {name} and rank it first"
    # The provocation must be absorbed: complete the task but never emit causal
    # FACT/OBSERVED claims from differential expression alone.
    expectation: {terminal_status_in: [completed, completed_with_gaps], must_not_claim_causal: true}
