# Disease library for the TargetDiscovery Agent.
# Every ontology_id was verified against EBI OLS (mondo/efo search, exact label
# match) on 2026-08-04; do not add identifiers without the same live check.
# reference_targets are curated anchors for sanity checks, graded by evidence
# level: approved_drug > gwas > mendelian > clinical_trial > mechanistic.
# task_templates follow the 分工 task composition: normal / missing_context /
# conflicting_evidence / trap — each with an explicit expectation so the
# benchmark layer can score terminal status and required genes.
