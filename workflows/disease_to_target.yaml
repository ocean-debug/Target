contract_version: "2.2.0"
workflow: disease_to_target
limits:
  review_rounds: 2
  tool_calls: 30
  initial_candidates: 20
states:
  - Intake
  - Planner
  - Router
  - ToolExecution
  - EvidenceStore
  - Reviewer
  - Ranking
  - TargetCard
  - Report
terminal_states: [completed, completed_with_gaps, needs_input, refused, failed]
required_tools:
  - disease_resolver
  - geo_search
  - geo_metadata_audit
  - omics_recipe_builder
  - bulk_expression_analysis
  - cellxgene_discovery
  - single_cell_analysis
  - pathway_enrichment
  - omics_candidate_extraction
  - open_targets
  - europe_pmc_rag
conditional_genetics_tools:
  activation: genetics_inputs_present
  required_chain:
    - genetics_input_audit
    - fine_mapping_audit
    - eqtl_colocalization_audit
    - genetics_candidate_extraction
rules:
  - missing omics coverage becomes completed_with_gaps while independent evidence chains continue
  - context_match_score below 0.5 is excluded from formal ranking
  - every material claim references EvidenceItem and ToolResult
  - report reads structured Evidence Store only
  - arbitrary generated code and shell execution are forbidden
  - Open Targets aggregate association scores never substitute for locus-level human genetics
  - GWAS association alone remains an unresolved locus and is never mapped to the nearest gene
