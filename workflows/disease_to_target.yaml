contract_version: "2.0.0"
workflow: disease_to_target
limits:
  review_rounds: 2
  tool_calls: 30
  initial_candidates: 20
states:
  - Intake
  - Planner
  - Router
  - ToolExecution
  - EvidenceStore
  - Reviewer
  - Ranking
  - TargetCard
  - Report
terminal_states: [completed, completed_with_gaps, needs_input, refused, failed]
required_tools: [uc_omics_snapshot, open_targets, europe_pmc_rag, observed_tcell_perturbation, deltafactor]
rules:
  - coverage_status=not_covered must not become completed
  - context_match_score below 0.5 is excluded from formal ranking
  - every material claim references EvidenceItem and ToolResult
  - report reads structured Evidence Store only
