[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "target-discovery-agent"
version = "0.8.0"
description = "Evidence-gated Agent for disease-driven drug-target discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0,<4",
  "langgraph>=1.0,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
test = ["jsonschema>=4.22,<5", "pytest>=8.2,<9"]
omics-bulk = [
  "gseapy==1.1.9",
  "matplotlib==3.11.1",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pydeseq2==0.5.4",
  "scikit-learn==1.6.1",
  "scipy==1.15.3",
]
omics-single-cell = [
  "anndata==0.12.16",
  "scanpy[leiden]==1.11.5",
]
omics-census = ["cellxgene-census==1.17.*"]
mcp = ["mcp>=2.0,<3"]
secrets = ["keyring>=24,<26"]
train = [
  "accelerate>=0.33",
  "datasets>=2.20",
  "peft>=0.12",
  "torch>=2.2",
  "transformers>=4.44",
]

[project.scripts]
target-agent = "target_agent.cli:main"
target-agent-mcp = "target_agent.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
target_agent = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
